name: Build QGIS plugin package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pyqt5-dev-tools
          python -m pip install pb_tool mkdocs mkdocs-material

      - name: Build MkDocs site
        working-directory: docs
        run: mkdocs build --clean

      - name: Build plugin ZIP
        run: |
          echo y | pb_tool zip -n
          mkdir artifact
          unzip -q czech_land_use_and_CN_analyzer.zip -d artifact

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: czech_land_use_and_CN_analyzer
          path: artifact
          if-no-files-found: error

      - name: Preserve generated ZIP for release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pbtool-zip
          path: czech_land_use_and_CN_analyzer.zip
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download generated ZIP
        uses: actions/download-artifact@v4
        with:
          name: pbtool-zip
          path: dist

      - name: Publish ZIP as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/czech_land_use_and_CN_analyzer.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/czech_land_use_and_CN_analyzer.zip --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
